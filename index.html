<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stack">
<meta name="theme-color" content="#0B0F14">
<title>Stack</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14; --card:#151B23; --card2:#1B232E; --line:#232C37; --line2:#2C3743;
  --txt:#F2F5F7; --sub:#8B98A5; --faint:#4E5A66; --ghost:#39434E;
  --teal:#16EC9E; --blue:#00A3FF; --violet:#9D8CFF; --gold:#F5C042; --red:#FF3B5C;
  --teal-dim:rgba(22,236,158,.12); --blue-dim:rgba(0,163,255,.12); --violet-dim:rgba(157,140,255,.12);
  --cond:'Barlow Condensed',sans-serif; --body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{background:var(--bg);color:var(--txt);font-family:var(--body);min-height:100vh;overflow-x:hidden;font-size:14px;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{display:none;}
input,textarea,select{-webkit-appearance:none;appearance:none;font-family:var(--body);}
button{font-family:var(--body);cursor:pointer;}
#wrap{max-width:480px;margin:0 auto;position:relative;min-height:100vh;}

/* ── Header ── */
.hdr{position:sticky;top:0;z-index:60;background:rgba(11,15,20,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;}
.logo{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.22em;color:var(--txt);display:flex;align-items:center;gap:7px;}
.logo .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);}
.hdr .sp{flex:1;}
.datenav{display:flex;align-items:center;gap:4px;}
.dbtn{width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:15px;display:flex;align-items:center;justify-content:center;}
.dlabel{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);min-width:74px;text-align:center;}
.dlabel.today{color:var(--teal);}

/* ── Day strip ── */
.strip{display:flex;gap:4px;padding:12px 16px 2px;}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;padding:4px 0;border-radius:10px;}
.day .lb{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;}
.day.sel .lb{color:var(--txt);}
.day .tdot{width:4px;height:4px;border-radius:50%;background:transparent;}
.day .tdot.on{background:var(--blue);box-shadow:0 0 5px var(--blue);}

/* ── Layout bits ── */
.view{padding:4px 16px calc(96px + env(safe-area-inset-bottom));}
.h1{font-family:var(--cond);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 2px;}
.sub1{font-size:12px;color:var(--sub);margin-bottom:12px;}
.sec-h{display:flex;align-items:center;gap:8px;margin:20px 0 9px;}
.sec-h .d{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.sec-h .t{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);}
.sec-h .r{margin-left:auto;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.1em;color:var(--faint);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;}
.kpis{display:flex;gap:8px;}
.kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;}
.kpi .v{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1;}
.kpi .l{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:5px;}

/* ── Segmented tabs ── */
.seg{display:flex;gap:2px;margin:12px 0 4px;border-bottom:1px solid var(--line);}
.seg button{flex:1;background:none;border:none;padding:10px 4px 11px;font-family:var(--cond);font-weight:600;font-size:14.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;}
.seg button.on{color:var(--txt);}

/* ── Item rows ── */
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:7px;display:flex;align-items:center;gap:12px;}
.row.done{background:#121820;}
.row.off{opacity:.35;}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--ghost);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#04110B;background:transparent;transition:all .15s;}
.chk.on{border-color:var(--teal);background:var(--teal);box-shadow:0 0 10px rgba(22,236,158,.35);}
.chk.vio.on{border-color:var(--violet);background:var(--violet);box-shadow:0 0 10px rgba(157,140,255,.35);color:#0D0A1F;}
.rmain{flex:1;min-width:0;}
.rname{font-size:14px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.row.done .rname{color:var(--faint);}
.rmeta{font-family:var(--cond);font-weight:500;font-size:13px;letter-spacing:.05em;color:var(--faint);margin-top:2px;}
.rnote{font-size:11px;color:var(--ghost);margin-top:2px;}
.rarrow{background:none;border:none;color:var(--ghost);font-size:18px;padding:0 2px;}
.tag{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.12em;padding:2px 7px;border-radius:5px;text-transform:uppercase;}
.tag.on{background:var(--teal-dim);color:var(--teal);}
.tag.offd{background:rgba(255,255,255,.04);color:var(--ghost);}
.pill{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.14em;padding:3px 9px;border-radius:100px;text-transform:uppercase;}
.pill.aktiv{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(0,163,255,.3);}
.strike{text-decoration:line-through;color:var(--faint);}

/* ── Buttons ── */
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;letter-spacing:.02em;}
.btn.teal{background:var(--teal);color:#04110B;}
.btn.blue{background:var(--blue);color:#00131F;}
.btn.vio{background:var(--violet);color:#0D0A1F;}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--sub);}
.btn.danger{background:transparent;border:1px solid rgba(255,59,92,.35);color:var(--red);}
.btn.sm{width:auto;padding:8px 14px;font-size:12.5px;border-radius:10px;}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ── Charts / chips ── */
.chips{display:flex;gap:6px;margin:10px 0;}
.chip{flex:1;padding:7px 4px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--faint);font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(245,192,66,.08);}
.chip.blue.on{border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}

/* ── Bottom nav ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,17,23,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:70;}
.nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);padding:4px 0;}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav button .nl{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;}
.nav button.on.c-teal{color:var(--teal);} .nav button.on.c-blue{color:var(--blue);}
.nav button.on.c-vio{color:var(--violet);} .nav button.on.c-gold{color:var(--gold);}
.nav button.on.c-txt{color:var(--txt);}

/* ── Sheets / modals ── */
.backdrop{position:fixed;inset:0;background:rgba(4,6,9,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:120;}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#121821;border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;z-index:130;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.grab{width:38px;height:4px;border-radius:100px;background:var(--line2);margin:2px auto 14px;}
.sh-t{font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;}
.lbl{display:block;font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;}
.inp{width:100%;background:#0E141B;border:1px solid var(--line2);border-radius:11px;padding:12px 13px;color:var(--txt);font-size:15px;margin-bottom:14px;outline:none;}
.inp:focus{border-color:var(--sub);}
.optrow{display:flex;gap:6px;margin-bottom:14px;}
.opt{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--faint);font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;}
.opt.on{border-color:var(--teal);color:var(--teal);background:var(--teal-dim);}
.opt.on.b{border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}
.opt.on.v{border-color:var(--violet);color:var(--violet);background:var(--violet-dim);}
.opt.on.o{border-color:var(--red);color:var(--red);background:rgba(255,59,92,.1);}

/* ── Workout sheet (fullscreen) ── */
.wsheet{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;max-width:480px;left:50%;transform:translateX(-50%);}
.wtop{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:rgba(11,15,20,.95);}
.wtime{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.06em;color:var(--blue);min-width:64px;}
.wbody{flex:1;overflow-y:auto;padding:14px 16px 180px;}
.wname{background:none;border:none;color:var(--txt);font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;width:100%;outline:none;padding:0;margin-bottom:2px;}
.excard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px;}
.exh{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.exh .n{font-size:15px;font-weight:700;color:var(--blue);flex:1;}
.sethead,.setrow{display:grid;grid-template-columns:34px 1fr 62px 62px 40px;gap:7px;align-items:center;}
.sethead{margin-bottom:6px;}
.sethead div{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);text-align:center;}
.setrow{padding:5px 0;border-radius:10px;}
.setrow.done{background:rgba(22,236,158,.07);}
.setnum{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--sub);text-align:center;}
.setnum.pr{color:var(--gold);}
.prev{font-family:var(--cond);font-weight:500;font-size:13px;letter-spacing:.04em;color:var(--faint);text-align:center;overflow:hidden;white-space:nowrap;}
.sin{width:100%;background:#0E141B;border:1px solid var(--line2);border-radius:9px;padding:9px 4px;color:var(--txt);font-family:var(--cond);font-weight:600;font-size:16px;text-align:center;outline:none;}
.setrow.done .sin{border-color:transparent;background:transparent;color:var(--teal);}
.chkset{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line2);background:transparent;color:var(--faint);font-size:14px;font-weight:700;margin:0 auto;display:flex;align-items:center;justify-content:center;}
.chkset.on{background:var(--teal);border-color:var(--teal);color:#04110B;}
.addset{width:100%;margin-top:9px;padding:9px;border-radius:10px;border:1px dashed var(--line2);background:transparent;color:var(--sub);font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;}
.minibar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:448px;background:#10202E;border:1px solid rgba(0,163,255,.45);border-radius:14px;padding:11px 14px;z-index:75;display:flex;align-items:center;gap:10px;}

/* ── History / misc ── */
.wcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;}
.wch{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
.wch .n{font-size:15px;font-weight:700;flex:1;}
.wch .d{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;}
.wstat{display:flex;gap:14px;margin:8px 0 10px;}
.wstat div{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.05em;color:var(--sub);}
.wstat b{color:var(--txt);font-weight:700;}
.exline{font-size:12.5px;color:var(--sub);padding:3px 0;display:flex;gap:8px;}
.exline .c{color:var(--faint);font-family:var(--cond);min-width:22px;}
.trophy{color:var(--gold);}
.empty{text-align:center;padding:44px 20px;color:var(--faint);}
.empty .ic{font-size:30px;margin-bottom:10px;}
.empty .t1{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:4px;}
.empty .t2{font-size:12px;margin-bottom:18px;}
#toast{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#1B2733;border:1px solid var(--line2);color:var(--txt);padding:10px 18px;border-radius:100px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;}
#toast.show{opacity:1;}
.searchwrap{position:relative;margin-bottom:12px;}
.searchwrap .inp{margin-bottom:0;padding-left:36px;}
.searchwrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px;}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<div id="wrap">
  <div class="hdr">
    <div class="logo"><span class="dot"></span>STACK</div>
    <div class="sp"></div>
    <div class="datenav">
      <button class="dbtn" onclick="A.shiftDate(-1)">‹</button>
      <span class="dlabel" id="dlabel" onclick="A.goToday()">Heute</span>
      <button class="dbtn" onclick="A.shiftDate(1)">›</button>
    </div>
  </div>
  <div id="strip"></div>
  <div class="view" id="view"></div>
  <div class="nav" id="nav"></div>
  <div id="overlay"></div>
  <div id="workoutlayer"></div>
  <div id="toast"></div>
</div>
<script>
"use strict";
/* ══════════════ KONSTANTEN & DEFAULTS (identisch zur alten App) ══════════════ */
const DEFAULT_SUPPLEMENTS=[
 {id:"bpc157",name:"BPC-157",dose:"2,5 mg/Woche",section:"morgens",note:"täglich · Schulter",schedule:[]},
 {id:"tb500",name:"TB-500",dose:"2,5 mg/Woche",section:"morgens",note:"Mo + Do · Bauch",schedule:[1,4]},
 {id:"methblue",name:"Methylene Blue",dose:"10 mg",section:"morgens",note:"",schedule:[]},
 {id:"vitd3",name:"Vitamin D3",dose:"140 mcg",section:"morgens",note:"",schedule:[]},
 {id:"vitk2",name:"Vitamin K2",dose:"200 mcg",section:"morgens",note:"",schedule:[]},
 {id:"kreatin",name:"Kreatin",dose:"6 g",section:"morgens",note:"",schedule:[]},
 {id:"omega3",name:"Omega-3",dose:"3 g (1,6g EPA/1,2g DHA)",section:"morgens",note:"",schedule:[]},
 {id:"zink",name:"Zink",dose:"25 mg",section:"morgens",note:"",schedule:[]},
 {id:"selen",name:"Selen",dose:"200 mcg",section:"morgens",note:"L-Selenomethionin",schedule:[]},
 {id:"jod",name:"Jod",dose:"150 mcg – 1 Tropfen",section:"morgens",note:"ProFuel Forte",schedule:[]},
 {id:"lithium",name:"Lithium",dose:"2 mg – 1 ml auf Zunge",section:"morgens",note:"täglich neu mischen",schedule:[]},
 {id:"kupfer",name:"Kupfer",dose:"2 mg",section:"nachmittags",note:"",schedule:[]},
 {id:"glycin",name:"Glycin",dose:"6 g in Wasser",section:"abends",note:"30 min vor Schlaf",schedule:[]},
 {id:"mag",name:"Magnesium-Bisglycin",dose:"194 mg",section:"abends",note:"30 min vor Schlaf",schedule:[]},
];
const DEFAULT_HABITS=[
 {id:"schlaf",name:"8h Schlaf",category:"Gesundheit",note:"",schedule:[]},
 {id:"training",name:"Training",category:"Fitness",note:"",schedule:[1,2,3,4,5]},
 {id:"spazieren",name:"Spaziergang",category:"Bewegung",note:"30 min",schedule:[]},
 {id:"kalt",name:"Kaltdusche",category:"Wellness",note:"",schedule:[]},
 {id:"lesen",name:"Lesen",category:"Mindset",note:"30 min",schedule:[]},
 {id:"meditation",name:"Meditation",category:"Mindset",note:"10 min",schedule:[]},
];
const SUPP_SECTIONS={morgens:{label:"Morgens",color:"#F5C042"},nachmittags:{label:"Nachmittags",color:"#00A3FF"},abends:{label:"Abends",color:"#9D8CFF"}};
const EX_SUGGEST=[
 ["Bankdrücken (Langhantel)","Brust"],["Schrägbankdrücken (Kurzhantel)","Brust"],["Fliegende (Kabel)","Brust"],["Dips","Brust"],
 ["Klimmzüge","Rücken"],["Latzug","Rücken"],["Rudern (Langhantel)","Rücken"],["Rudern (Kabel)","Rücken"],["Kreuzheben","Rücken"],
 ["Kniebeugen","Beine"],["Beinpresse","Beine"],["Rumänisches Kreuzheben","Beine"],["Ausfallschritte","Beine"],["Beinstrecker","Beine"],["Beincurls","Beine"],["Wadenheben","Beine"],
 ["Schulterdrücken (Langhantel)","Schultern"],["Schulterdrücken (Kurzhantel)","Schultern"],["Seitheben","Schultern"],["Face Pulls","Schultern"],
 ["Bizeps-Curls (Langhantel)","Arme"],["Bizeps-Curls (Kurzhantel)","Arme"],["Hammer-Curls","Arme"],["Trizepsdrücken (Kabel)","Arme"],["French Press","Arme"],
 ["Crunches","Core"],["Beinheben","Core"],["Cable Crunch","Core"],
];
const DOW=["So","Mo","Di","Mi","Do","Fr","Sa"];
const DOW_ORDER=[1,2,3,4,5,6,0];
const MONTHS=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONTHS_L=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const DOW_L=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

/* ══════════════ HELFER ══════════════ */
function pad(n){return String(n).padStart(2,"0");}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function offsetKey(key,n){const[y,m,d]=key.split("-").map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());}
function getDow(key){const[y,m,d]=key.split("-").map(Number);return new Date(y,m-1,d).getDay();}
function formatKey(key){if(key===todayKey())return"Heute";if(key===offsetKey(todayKey(),-1))return"Gestern";const[y,m,d]=key.split("-").map(Number);const dt=new Date(y,m-1,d);return DOW[dt.getDay()]+", "+d+". "+MONTHS[m-1];}
function formatKeyLong(key){const[y,m,d]=key.split("-").map(Number);const dt=new Date(y,m-1,d);return DOW_L[dt.getDay()]+", "+d+". "+MONTHS_L[m-1]+" "+y;}
function weekStart(key){const dow=getDow(key);const diff=dow===0?-6:1-dow;return offsetKey(key,diff);}
function uid(){return Math.random().toString(36).slice(2,9);}
function activeItems(items,key){const dow=getDow(key);return items.filter(function(s){return !s.schedule||s.schedule.length===0||s.schedule.includes(dow);});}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function fmtN(n,dec){return Number(n).toLocaleString("de-DE",{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0});}
function fmtDur(min){if(min<60)return min+" min";const h=Math.floor(min/60);return h+":"+pad(min%60)+" h";}
function fmtClock(sec){const m=Math.floor(sec/60),s=sec%60;return m+":"+pad(s);}
function ls(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function lss(k,v){localStorage.setItem(k,JSON.stringify(v));}
function vib(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

/* Einmalige, nicht-destruktive Migration: alter stackTrainLog → neue Workout-Sessions.
   Der alte Key bleibt unangetastet, damit nichts verloren geht. */
(function migrate(){
 const w=ls("stackWorkouts");
 if(w!==null){S.workouts=w;return;}
 const old=ls("stackTrainLog")||{};
 const exMap={};S.exercises.forEach(function(e){exMap[e.id]=e.name;});
 const out=[];
 Object.keys(old).sort().forEach(function(dk){
  const day=old[dk];const exs=[];let vol=0,sets=0;
  Object.keys(day).forEach(function(exId){
   const e=day[exId];if(!e)return;
   const n=Math.max(1,parseInt(e.sets)||1);const wgt=parseFloat(e.weight)||0;
   const arr=[];for(let i=0;i<n;i++)arr.push({w:wgt,r:null});
   exs.push({exId:exId,name:exMap[exId]||"Übung",sets:arr});
   vol+=wgt*n;sets+=n;
  });
  if(exs.length)out.push({id:uid(),name:"Training",dateKey:dk,start:null,end:null,durMin:null,exercises:exs,volume:Math.round(vol),sets:sets,prs:[],legacy:true});
 });
 S.workouts=out;saveWorkouts();
})();

/* ══════════════ ABLEITUNGEN ══════════════ */
function activeSupps(){return S.supps.filter(function(s){return s.active!==false;});}
function suppChecked(id,key){const d=S.suppData[key];return !!(d&&d.taken&&d.taken[id]);}
function suppPct(key){const a=activeItems(activeSupps(),key);if(!a.length)return{pct:0,done:0,total:0};const done=a.filter(function(s){return suppChecked(s.id,key);}).length;return{pct:Math.round(done/a.length*100),done:done,total:a.length};}
function habitStatus(id,key){const d=S.habitData[key];return d&&d.status?d.status[id]:undefined;}
function habitPct(key){const a=activeItems(S.habits.filter(function(h){return h.active!==false;}),key);if(!a.length)return{pct:0,done:0,total:0};const done=a.filter(function(h){return habitStatus(h.id,key)==="done";}).length;return{pct:Math.round(done/a.length*100),done:done,total:a.length};}
function suppStreak(){let s=0,k=todayKey();while(true){const a=activeItems(activeSupps(),k);if(!a.length)break;const t=a.filter(function(x){return suppChecked(x.id,k);}).length;if(!t)break;s++;k=offsetKey(k,-1);}return s;}
function habitStreak(){let s=0,k=todayKey();while(true){const a=activeItems(S.habits,k);if(!a.length)break;const d=a.filter(function(x){return habitStatus(x.id,k)==="done";}).length;if(!d)break;s++;k=offsetKey(k,-1);}return s;}
function weekWorkouts(key){const st=weekStart(key);const days=[];for(let i=0;i<7;i++)days.push(offsetKey(st,i));return S.workouts.filter(function(w){return days.includes(w.dateKey);});}
function trainedOn(key){return S.workouts.some(function(w){return w.dateKey===key;});}
function exHistory(exId){const rows=[];S.workouts.slice().sort(function(a,b){return a.dateKey<b.dateKey?-1:1;}).forEach(function(w){w.exercises.forEach(function(e){if(e.exId===exId&&e.sets.length){let mx=0,vol=0;e.sets.forEach(function(st){const wt=parseFloat(st.w)||0,r=st.r==null?1:(parseFloat(st.r)||0);if(wt>mx)mx=wt;vol+=wt*(st.r==null?1:r);});rows.push({dateKey:w.dateKey,max:mx,vol:Math.round(vol),sets:e.sets.length,sets_arr:e.sets,wid:w.id});}});});return rows;}
function exMaxBefore(exId,excludeWid){let mx=0;S.workouts.forEach(function(w){if(w.id===excludeWid)return;w.exercises.forEach(function(e){if(e.exId===exId)e.sets.forEach(function(st){const wt=parseFloat(st.w)||0;if(wt>mx)mx=wt;});});});return mx;}
function lastSetsFor(exId){const h=exHistory(exId);return h.length?h[h.length-1].sets_arr:null;}

/* ══════════════ SVG-BAUSTEINE (Whoop-Ringe & Charts) ══════════════ */
function ring(size,stroke,pct,color,label,value,subline,glow){
 const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(100,Math.max(0,pct))/100);
 return '<div style="width:'+size+'px;display:flex;flex-direction:column;align-items:center;gap:6px;">'
 +'<div style="position:relative;width:'+size+'px;height:'+size+'px;">'
 +'<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg);">'
 +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#1C242E" stroke-width="'+stroke+'"/>'
 +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"'+(glow?' style="filter:drop-shadow(0 0 6px '+color+'66)"':'')+'/>'
 +'</svg>'
 +'<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">'
 +'<div style="font-family:var(--cond);font-weight:700;font-size:'+Math.round(size*0.27)+'px;line-height:1;color:var(--txt);">'+value+'</div>'
 +(subline?'<div style="font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.08em;color:var(--faint);margin-top:2px;">'+subline+'</div>':'')
 +'</div></div>'
 +'<div style="font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:'+color+';">'+label+'</div>'
 +'</div>';
}
function miniRing(size,stroke,pct,color){
 const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(100,Math.max(0,pct))/100);
 return '<svg width="'+size+'" height="'+size+'" style="transform:rotate(-90deg);display:block;">'
 +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#222B36" stroke-width="'+stroke+'"/>'
 +(pct>0?'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>':'')
 +'</svg>';
}
function lineChart(data,w,h,color,unit,dec){
 if(data.length<2)return '<div class="empty" style="padding:24px;">Noch zu wenig Daten</div>';
 const vals=data.map(function(d){return d.v;});
 let min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
 if(min===max){min-=1;max+=1;}
 const padY=(max-min)*0.15;min-=padY;max+=padY;
 const px=function(i){return 8+i/(data.length-1)*(w-52);};
 const py=function(v){return h-18-(v-min)/(max-min)*(h-30);};
 let path="",area="M "+px(0)+" "+(h-18);
 data.forEach(function(d,i){const x=px(i),y=py(d.v);path+=(i?" L ":"M ")+x.toFixed(1)+" "+y.toFixed(1);area+=" L "+x.toFixed(1)+" "+y.toFixed(1);});
 area+=" L "+px(data.length-1)+" "+(h-18)+" Z";
 const gid="g"+uid();
 const last=data[data.length-1];
 return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;display:block;">'
 +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".28"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
 +'<line x1="8" y1="'+py(max-padY)+'" x2="'+(w-44)+'" y2="'+py(max-padY)+'" stroke="#1E2731" stroke-dasharray="3 4"/>'
 +'<line x1="8" y1="'+py(min+padY)+'" x2="'+(w-44)+'" y2="'+py(min+padY)+'" stroke="#1E2731" stroke-dasharray="3 4"/>'
 +'<path d="'+area+'" fill="url(#'+gid+')"/>'
 +'<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'
 +'<circle cx="'+px(data.length-1)+'" cy="'+py(last.v)+'" r="3.6" fill="'+color+'"/>'
 +'<text x="'+(w-40)+'" y="'+(py(max-padY)+4)+'" fill="#4E5A66" font-family="Barlow Condensed" font-size="11">'+fmtN(max-padY,dec)+'</text>'
 +'<text x="'+(w-40)+'" y="'+(py(min+padY)+4)+'" fill="#4E5A66" font-family="Barlow Condensed" font-size="11">'+fmtN(min+padY,dec)+'</text>'
 +'<text x="8" y="'+(h-4)+'" fill="#4E5A66" font-family="Barlow Condensed" font-size="11">'+data[0].l+'</text>'
 +'<text x="'+(w-44)+'" y="'+(h-4)+'" text-anchor="end" fill="#4E5A66" font-family="Barlow Condensed" font-size="11">'+last.l+'</text>'
 +'</svg>';
}
function barChart(data,w,h,color){
 if(data.length<1)return '<div class="empty" style="padding:24px;">Noch zu wenig Daten</div>';
 const vals=data.map(function(d){return d.v;});const max=Math.max.apply(null,vals)||1;
 const n=data.length,gap=4,bw=Math.min(26,(w-52-gap*(n-1))/n);
 let bars="";
 data.forEach(function(d,i){const x=8+i*(bw+gap),bh=Math.max(2,d.v/max*(h-32)),y=h-18-bh;
  bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+color+'" opacity="'+(i===n-1?1:0.55)+'"/>';});
 return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;display:block;">'+bars
 +'<line x1="6" y1="'+(h-18)+'" x2="'+(w-44)+'" y2="'+(h-18)+'" stroke="#1E2731"/>'
 +'<text x="'+(w-40)+'" y="16" fill="#4E5A66" font-family="Barlow Condensed" font-size="11">'+fmtN(max)+'</text>'
 +'<text x="8" y="'+(h-4)+'" fill="#4E5A66" font-family="Barlow Condensed" font-size="11">'+data[0].l+'</text>'
 +'<text x="'+(w-44)+'" y="'+(h-4)+'" text-anchor="end" fill="#4E5A66" font-family="Barlow Condensed" font-size="11">'+data[data.length-1].l+'</text>'
 +'</svg>';
}

let editItem=null,editKind=null;
A.newSupp=function(){editItem={id:uid(),name:"",dose:"",section:"morgens",note:"",schedule:[],active:true};editKind="supp";S.confirmId=null;renderEdit();};
A.editSupp=function(id){const s=S.supps.find(function(x){return x.id===id;});if(!s)return;editItem=JSON.parse(JSON.stringify(s));if(!editItem.schedule)editItem.schedule=[];editKind="supp";S.confirmId=null;renderEdit();};
A.newHabit=function(){editItem={id:uid(),name:"",category:"",note:"",schedule:[],active:true};editKind="habit";S.confirmId=null;renderEdit();};
A.editHabit=function(id){const h=S.habits.find(function(x){return x.id===id;});if(!h)return;editItem=JSON.parse(JSON.stringify(h));if(!editItem.schedule)editItem.schedule=[];editKind="habit";S.confirmId=null;renderEdit();};
A.closeEdit=function(){editItem=null;document.getElementById("overlay").innerHTML="";};
A.eF=function(field,val){if(editItem)editItem[field]=val;};
A.eSec=function(sec){editItem.section=sec;renderEdit();};
A.eActive=function(v){editItem.active=v;renderEdit();};
A.eDay=function(d){const s=editItem.schedule||[];editItem.schedule=s.includes(d)?s.filter(function(x){return x!==d;}):s.concat([d]);renderEdit();};
A.eSave=function(){
 if(!editItem.name||!editItem.name.trim()){toast("Name darf nicht leer sein");return;}
 editItem.name=editItem.name.trim();
 if(editKind==="supp"){
  const i=S.supps.findIndex(function(x){return x.id===editItem.id;});
  if(i>=0)S.supps[i]=editItem;else S.supps.push(editItem);
  saveSupps();
 }else{
  const i=S.habits.findIndex(function(x){return x.id===editItem.id;});
  if(i>=0)S.habits[i]=editItem;else S.habits.push(editItem);
  saveHabits();
 }
 A.closeEdit();toast("✓ Gespeichert");render();
};
A.eDelete=function(){
 if(S.confirmId!=="edit"){S.confirmId="edit";renderEdit();return;}
 if(editKind==="supp"){S.supps=S.supps.filter(function(x){return x.id!==editItem.id;});saveSupps();}
 else{S.habits=S.habits.filter(function(x){return x.id!==editItem.id;});saveHabits();}
 A.closeEdit();toast("Endgültig gelöscht");S.confirmId=null;render();
};
function dayBtns(){
 return '<div class="optrow" style="gap:5px;">'+DOW_ORDER.map(function(d){
  const on=(editItem.schedule||[]).includes(d);
  return '<button class="opt'+(on?" on":"")+'" style="padding:9px 2px;font-size:12px;" onclick="A.eDay('+d+')">'+DOW[d]+'</button>';
 }).join("")+'</div>';
}
function renderEdit(){
 const isSupp=editKind==="supp";
 const exists=isSupp?S.supps.some(function(x){return x.id===editItem.id;}):S.habits.some(function(x){return x.id===editItem.id;});
 let html='<div class="backdrop" onclick="A.closeEdit()"></div><div class="sheet"><div class="grab"></div>'
 +'<div class="sh-t">'+(exists?"Bearbeiten":(isSupp?"Neues Supplement":"Neue Gewohnheit"))+'</div>'
 +'<label class="lbl">Name</label><input class="inp" value="'+esc(editItem.name)+'" oninput="A.eF(\'name\',this.value)">';
 if(isSupp){
  html+='<label class="lbl">Dosis</label><input class="inp" value="'+esc(editItem.dose)+'" oninput="A.eF(\'dose\',this.value)">'
  +'<label class="lbl">Tageszeit</label><div class="optrow">'
  +Object.keys(SUPP_SECTIONS).map(function(sec){return '<button class="opt'+(editItem.section===sec?" on":"")+'" onclick="A.eSec(\''+sec+'\')">'+SUPP_SECTIONS[sec].label+'</button>';}).join("")+'</div>';
 }else{
  html+='<label class="lbl">Kategorie</label><input class="inp" value="'+esc(editItem.category||"")+'" oninput="A.eF(\'category\',this.value)">';
 }
 html+='<label class="lbl">Notiz</label><input class="inp" value="'+esc(editItem.note||"")+'" oninput="A.eF(\'note\',this.value)">'
 +'<label class="lbl">Geplante Tage <span style="color:var(--ghost);letter-spacing:.05em;">(leer = täglich)</span></label>'+dayBtns()
 +'<label class="lbl">Status</label><div class="optrow">'
 +'<button class="opt'+(editItem.active!==false?" on b":"")+'" onclick="A.eActive(true)">✓ Aktiv</button>'
 +'<button class="opt'+(editItem.active===false?" on o":"")+'" onclick="A.eActive(false)">✗ Inaktiv</button></div>'
 +'<div style="font-size:11px;color:var(--faint);margin:-6px 0 16px;">Inaktive Einträge verschwinden aus der Tagesliste, bleiben aber im Verlauf vollständig erhalten.</div>'
 +'<button class="btn '+(isSupp?"teal":"vio")+'" onclick="A.eSave()">Speichern</button>'
 +(exists?'<div style="height:8px;"></div><button class="btn danger" onclick="A.eDelete()">'+(S.confirmId==="edit"?"Wirklich endgültig löschen? Nochmal tippen":"Endgültig löschen")+'</button>':'')
 +'</div>';
 document.getElementById("overlay").innerHTML=html;
}

A.exportList=function(type){

 if(type==="supplements"){
  const secs={morgens:[],nachmittags:[],abends:[]};
  activeItems(activeSupps(),key).forEach(function(s){if(secs[s.section])secs[s.section].push(s);});
  Object.keys(SUPP_SECTIONS).forEach(function(sec){
   if(!secs[sec].length)return;

  cats.forEach(function(cat){
   rows+='<tr><td colspan="3" style="background:#f5f5f5;color:#333;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid #e5e5e5;">'+esc(cat)+'</td></tr>';

function vWeight(){

 const cutoff=offsetKey(todayKey(),-S.wRange+1);

 const first=range.length?range[0].v:null;

 +'<button class="btn sm" style="background:var(--gold);color:#1A1200;padding:0 22px;" onclick="A.wSave()">Speichern</button></div>'

  +'<div class="kpi"><div class="v" style="color:'+(delta!=null&&delta>0?"var(--gold)":"var(--teal)")+';">'+(delta!=null?(delta>0?"+":"")+fmtN(delta,1):"–")+'</div><div class="l">Δ Zeitraum</div></div>'
  +'<div class="kpi"><div class="v">'+keys.length+'</div><div class="l">Einträge</div></div></div>';
 }
 html+='<div class="chips">'+[[7,"7T"],[30,"30T"],[90,"90T"],[365,"1J"]].map(function(r){

 +'<div class="card">'+(range.length>1?lineChart(range,420,180,"#F5C042","kg",1):'<div class="empty" style="padding:26px;"><div class="t1">Zu wenig Daten im Zeitraum</div><div class="t2">Trage regelmäßig dein Gewicht ein</div></div>')+'</div>';
 if(keys.length){

  keys.slice(-10).reverse().forEach(function(k){

  });
 }
 return html;
}

function vTrainHistory(){

   html+='<div class="row"><div class="rmain"><div class="rname">'+formatKey(r.dateKey)+(r.max>=pr&&pr>0?' <span class="trophy">🏆</span>':'')+'</div>'

function ensureExercise(name,category){
 const ex=S.exercises.find(function(e){return e.name.toLowerCase()===name.toLowerCase();});

}
A.pickEx=function(id){const e=S.exercises.find(function(x){return x.id===id;});if(e)pickDone(e);};

 document.getElementById("overlay").innerHTML="";
 if(pickMode==="workout")addExToActive(e);

 if(q)html+='<button class="btn ghost" style="margin-bottom:12px;" onclick="A.pickCreate()">+ „'+esc(pickQ.trim())+'“ neu anlegen</button>';
 if(mine.length){

  mine.forEach(function(e){

 }

/* ══════════════ AKTIVES WORKOUT (Hevy-Kern) ══════════════ */
let woOpen=false;
function prevFor(exId){
 const last=lastSetsFor(exId);
 if(!last)return null;
 return last.map(function(st){return{w:parseFloat(st.w)||0,r:st.r==null?null:(parseFloat(st.r)||0)};});
}
function addExToActive(e){
 const prev=prevFor(e.id);
 const n=prev?Math.min(6,Math.max(1,prev.length)):3;
 const sets=[];
 for(let i=0;i<n;i++){const p=prev?(prev[i]||prev[prev.length-1]):null;sets.push({w:"",r:"",done:false,pw:p?p.w:null,pr:p?p.r:null});}
 S.active.exercises.push({exId:e.id,name:e.name,sets:sets});
 saveActive();renderWorkout();
}
A.startEmpty=function(){
 if(S.active){A.resume();toast("Workout läuft bereits");return;}
 S.active={id:uid(),name:"Workout",dateKey:S.date,startTs:Date.now(),exercises:[]};
 saveActive();A.resume();
};
A.startRoutine=function(id){
 if(S.active){A.resume();toast("Workout läuft bereits");return;}
 const r=S.routines.find(function(x){return x.id===id;});if(!r)return;
 S.active={id:uid(),name:r.name,dateKey:S.date,startTs:Date.now(),exercises:[]};
 r.exercises.forEach(function(re){
  const prev=prevFor(re.exId);const sets=[];
  for(let i=0;i<re.sets;i++){const p=prev?(prev[i]||prev[prev.length-1]):null;sets.push({w:"",r:"",done:false,pw:p?p.w:null,pr:p?p.r:null});}
  S.active.exercises.push({exId:re.exId,name:re.name,sets:sets});
 });
 saveActive();A.resume();
};
A.resume=function(){woOpen=true;renderWorkout();renderMini();};
A.minimize=function(){woOpen=false;document.getElementById("workoutlayer").innerHTML="";renderMini();};
A.wName=function(v){if(S.active){S.active.name=v;saveActive();}};
A.setW=function(ei,si,v){const st=S.active.exercises[ei].sets[si];st.w=v;saveActive();};
A.setR=function(ei,si,v){const st=S.active.exercises[ei].sets[si];st.r=v;saveActive();};
A.toggleSet=function(ei,si){
 const st=S.active.exercises[ei].sets[si];
 if(!st.done){
  if(st.w===""&&st.pw!=null)st.w=String(st.pw);
  if(st.r===""&&st.pr!=null)st.r=String(st.pr);
  st.done=true;
  vib(30);
 }else{st.done=false;}
 saveActive();renderWorkout();
};
A.addSet=function(ei){
 const ex=S.active.exercises[ei];
 const lastRow=ex.sets[ex.sets.length-1];
 ex.sets.push({w:"",r:"",done:false,pw:lastRow?(lastRow.w!==""?parseFloat(lastRow.w)||lastRow.pw:lastRow.pw):null,pr:lastRow?(lastRow.r!==""?parseFloat(lastRow.r)||lastRow.pr:lastRow.pr):null});
 saveActive();renderWorkout();
};
A.exMenu=function(ei){
 const ex=S.active.exercises[ei];
 document.getElementById("overlay").innerHTML='<div class="backdrop" onclick="A.closeEdit()"></div><div class="sheet"><div class="grab"></div>'
 +'<div class="sh-t">'+esc(ex.name)+'</div>'
 +'<button class="btn ghost" style="margin-bottom:8px;" onclick="A.rmSet('+ei+')">Letzten Satz entfernen</button>'
 +'<button class="btn danger" style="margin-bottom:8px;" onclick="A.rmEx('+ei+')">Übung aus Workout entfernen</button>'
 +'<button class="btn ghost" onclick="A.closeEdit()">Abbrechen</button></div>';
};
A.rmSet=function(ei){const ex=S.active.exercises[ei];if(ex.sets.length>1)ex.sets.pop();saveActive();A.closeEdit();renderWorkout();};
A.rmEx=function(ei){S.active.exercises.splice(ei,1);saveActive();A.closeEdit();renderWorkout();};
function elapsedSec(){return S.active?Math.max(0,Math.floor((Date.now()-S.active.startTs)/1000)):0;}
function renderWorkout(){
 if(!S.active||!woOpen){document.getElementById("workoutlayer").innerHTML="";return;}
 const a=S.active;
 let html='<div class="wsheet">'
 +'<div class="wtop">'
 +'<button class="iconbtn" onclick="A.minimize()">⌄</button>'
 +'<span class="wtime" id="welapsed">'+fmtClock(elapsedSec())+'</span>'
 +'<div class="sp" style="flex:1;"></div>'
 +'<button class="btn danger sm" onclick="A.askDiscard()">✕</button>'
 +'<button class="btn teal sm" onclick="A.finish()">Fertig</button>'
 +'</div><div class="wbody">'
 +'<input class="wname" value="'+esc(a.name)+'" oninput="A.wName(this.value)">'
 +'<div style="font-family:var(--cond);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:14px;">'+formatKey(a.dateKey)+(a.dateKey!==todayKey()?' · nachträglich':'')+'</div>';
 if(!a.exercises.length){
  html+='<div class="card empty" style="padding:26px;"><div class="ic">🏋️</div><div class="t1">Füge deine erste Übung hinzu</div><div class="t2">Vorherige Werte werden automatisch angezeigt</div></div>';
 }
 a.exercises.forEach(function(ex,ei){
  const doneN=ex.sets.filter(function(s){return s.done;}).length;
  html+='<div class="excard"><div class="exh"><span class="n">'+esc(ex.name)+'</span>'
  +'<span style="font-family:var(--cond);font-size:12px;letter-spacing:.1em;color:var(--faint);">'+doneN+'/'+ex.sets.length+'</span>'
  +'<button class="iconbtn" style="width:28px;height:28px;" onclick="A.exMenu('+ei+')">⋯</button></div>'
  +'<div class="sethead"><div>Satz</div><div>Letztes</div><div>kg</div><div>Wdh</div><div>✓</div></div>';
  ex.sets.forEach(function(st,si){
   const prevTxt=st.pw!=null?(st.pr!=null?fmtN(st.pw,st.pw%1?1:0)+"×"+st.pr:fmtN(st.pw,st.pw%1?1:0)+" kg"):"–";
   html+='<div class="setrow'+(st.done?" done":"")+'">'
   +'<div class="setnum">'+(si+1)+'</div>'
   +'<div class="prev">'+prevTxt+'</div>'
   +'<input class="sin" inputmode="decimal" placeholder="'+(st.pw!=null?fmtN(st.pw,st.pw%1?1:0):"kg")+'" value="'+esc(st.w)+'" oninput="A.setW('+ei+','+si+',this.value)">'
   +'<input class="sin" inputmode="numeric" placeholder="'+(st.pr!=null?st.pr:"Wdh")+'" value="'+esc(st.r)+'" oninput="A.setR('+ei+','+si+',this.value)">'
   +'<button class="chkset'+(st.done?" on":"")+'" onclick="A.toggleSet('+ei+','+si+')">✓</button>'
   +'</div>';
  });
  html+='<button class="addset" onclick="A.addSet('+ei+')">+ Satz</button></div>';
 });
 html+='<button class="btn blue" style="margin-top:4px;" onclick="A.openPicker(\'workout\')">+ Übung hinzufügen</button>'
 +'</div></div>';
 document.getElementById("workoutlayer").innerHTML=html;
}
A.askDiscard=function(){
 document.getElementById("overlay").innerHTML='<div class="backdrop" onclick="A.closeEdit()"></div><div class="sheet"><div class="grab"></div>'
 +'<div class="sh-t">Workout verwerfen?</div>'
 +'<div style="font-size:13px;color:var(--sub);margin-bottom:16px;">Alle Eingaben dieses Workouts gehen verloren. Gespeicherte Workouts sind nicht betroffen.</div>'
 +'<button class="btn danger" style="margin-bottom:8px;" onclick="A.doDiscard()">Ja, verwerfen</button>'
 +'<button class="btn ghost" onclick="A.closeEdit()">Weiter trainieren</button></div>';
};
A.doDiscard=function(){S.active=null;saveActive();woOpen=false;A.closeEdit();document.getElementById("workoutlayer").innerHTML="";renderMini();render();toast("Workout verworfen");};
function buildRecord(){
 const a=S.active;const exs=[];let vol=0,sets=0;const prs=[];
 a.exercises.forEach(function(ex){
  const done=ex.sets.filter(function(s){return s.done;}).map(function(s){return{w:parseFloat(String(s.w).replace(",","."))||0,r:Math.max(0,parseInt(s.r)||0)};});
  if(!done.length)return;
  let mx=0;done.forEach(function(s){vol+=s.w*s.r;sets++;if(s.w>mx)mx=s.w;});
  if(mx>0&&mx>exMaxBefore(ex.exId,null))prs.push(ex.exId);
  exs.push({exId:ex.exId,name:ex.name,sets:done});
 });
 return{id:a.id,name:(a.name||"Workout").trim()||"Workout",dateKey:a.dateKey,start:a.startTs,end:Date.now(),durMin:Math.max(1,Math.round((Date.now()-a.startTs)/60000)),exercises:exs,volume:Math.round(vol),sets:sets,prs:prs};
}
A.finish=function(){
 const rec=buildRecord();
 if(!rec.exercises.length){toast("Noch kein Satz abgehakt");return;}
 const prNames=rec.prs.map(function(id){const e=S.exercises.find(function(x){return x.id===id;});return e?e.name:"";}).filter(Boolean);
 document.getElementById("overlay").innerHTML='<div class="backdrop"></div><div class="sheet"><div class="grab"></div>'
 +'<div class="sh-t" style="color:var(--teal);">Workout abschließen</div>'
 +'<div class="kpis" style="margin-bottom:14px;">'
 +'<div class="kpi"><div class="v" style="color:var(--blue);">'+fmtDur(rec.durMin)+'</div><div class="l">Dauer</div></div>'
 +'<div class="kpi"><div class="v" style="color:var(--teal);">'+fmtN(rec.volume)+'</div><div class="l">Volumen kg</div></div>'
 +'<div class="kpi"><div class="v">'+rec.sets+'</div><div class="l">Sätze</div></div></div>'
 +(prNames.length?'<div class="card" style="border-color:rgba(245,192,66,.4);margin-bottom:14px;"><div style="font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--gold);margin-bottom:4px;">🏆 '+prNames.length+' neue'+(prNames.length===1?"r":"")+' Rekord'+(prNames.length===1?"":"e")+'</div><div style="font-size:12.5px;color:var(--sub);">'+prNames.map(esc).join(" · ")+'</div></div>':'')
 +'<button class="btn teal" style="margin-bottom:8px;" onclick="A.saveWorkout()">Workout speichern</button>'
 +'<button class="btn ghost" style="margin-bottom:8px;" onclick="A.saveAsRoutine()">Auch als Routine speichern</button>'
 +'<button class="btn ghost" onclick="A.closeEdit()">Weiter trainieren</button></div>';
};
A.saveAsRoutine=function(){
 const a=S.active;
 const r={id:uid(),name:(a.name||"Routine").trim()||"Routine",exercises:a.exercises.filter(function(e){return e.sets.some(function(s){return s.done;});}).map(function(e){return{exId:e.exId,name:e.name,sets:e.sets.filter(function(s){return s.done;}).length||3};})};
 if(!r.exercises.length){toast("Keine abgehakten Übungen");return;}
 S.routines.push(r);saveRoutines();toast("✓ Routine gespeichert");A.saveWorkout();
};
A.saveWorkout=function(){
 const rec=buildRecord();
 S.workouts.push(rec);saveWorkouts();
 S.active=null;saveActive();woOpen=false;
 A.closeEdit();document.getElementById("workoutlayer").innerHTML="";
 S.tab="train";S.trTab="verlauf";renderMini();render();
 toast(rec.prs.length?"✓ Gespeichert · 🏆 "+rec.prs.length+" PR":"✓ Workout gespeichert");
 vib([40,60,40]);
};

/* ══════════════ WORKOUT-DETAIL & LÖSCHEN ══════════════ */
A.openWorkout=function(id){
 const w=S.workouts.find(function(x){return x.id===id;});if(!w)return;
 S.confirmId=null;
 let html='<div class="backdrop" onclick="A.closeEdit()"></div><div class="sheet"><div class="grab"></div>'
 +'<div class="sh-t">'+esc(w.name)+'</div>'
 +'<div style="font-family:var(--cond);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:-8px 0 12px;">'+formatKeyLong(w.dateKey)+(w.legacy?" · aus alter Version importiert":"")+'</div>'
 +'<div class="kpis" style="margin-bottom:14px;">'
 +(w.durMin?'<div class="kpi"><div class="v" style="color:var(--blue);">'+fmtDur(w.durMin)+'</div><div class="l">Dauer</div></div>':'')
 +'<div class="kpi"><div class="v" style="color:var(--teal);">'+fmtN(w.volume)+'</div><div class="l">Volumen kg</div></div>'
 +'<div class="kpi"><div class="v">'+w.sets+'</div><div class="l">Sätze</div></div></div>';
 w.exercises.forEach(function(e){
  html+='<div class="excard" style="padding:11px 13px;"><div class="exh" style="margin-bottom:6px;"><span class="n">'+esc(e.name)+(w.prs&&w.prs.includes(e.exId)?' <span class="trophy">🏆</span>':'')+'</span></div>';
  e.sets.forEach(function(st,i){
   const wv=parseFloat(st.w)||0;
   html+='<div class="exline"><span class="c">'+(i+1)+'</span>'+fmtN(wv,wv%1?1:0)+' kg'+(st.r==null?'':' × '+st.r)+'</div>';
  });
  html+='</div>';
 });
 html+='<button class="btn danger" style="margin-top:6px;" id="wdel" onclick="A.delWorkout(\''+w.id+'\')">Workout löschen</button></div>';
 document.getElementById("overlay").innerHTML=html;
};
A.delWorkout=function(id){
 if(S.confirmId!=="wdel"+id){S.confirmId="wdel"+id;const b=document.getElementById("wdel");if(b)b.textContent="Wirklich löschen? Nochmal tippen";return;}
 S.workouts=S.workouts.filter(function(x){return x.id!==id;});
 saveWorkouts();S.confirmId=null;A.closeEdit();render();toast("Workout gelöscht");
};

/* ══════════════ EINSTELLUNGEN ══════════════ */
A.openSettings=function(){renderSettings();};
A.sGoal=function(d){S.settings.weekGoal=Math.max(1,Math.min(14,S.settings.weekGoal+d));saveSettings();renderSettings();};
function renderSettings(){
 document.getElementById("overlay").innerHTML='<div class="backdrop" onclick="A.closeEdit()"></div><div class="sheet"><div class="grab"></div>'
 +'<div class="sh-t">Training · Einstellungen</div>'
 +'<label class="lbl">Wochenziel (Workouts)</label>'
 +'<div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">'
 +'<button class="iconbtn" onclick="A.sGoal(-1)">−</button>'
 +'<span style="font-family:var(--cond);font-weight:700;font-size:28px;min-width:40px;text-align:center;">'+S.settings.weekGoal+'</span>'
 +'<button class="iconbtn" onclick="A.sGoal(1)">＋</button></div>'
 +'<button class="btn blue" onclick="A.closeEdit();render();">Fertig</button></div>';
}

/* ══════════════ MINIBAR + TICK + INIT ══════════════ */
function renderMini(){
 let bar=document.getElementById("minibar");
 if(S.active&&!woOpen){
  const html='<span class="wtime" id="minitime" style="font-size:17px;">'+fmtClock(elapsedSec())+'</span>'
  +'<span style="flex:1;font-size:13px;font-weight:600;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(S.active.name)+' läuft</span>'
  +'<button class="btn blue sm" onclick="A.resume()">Fortsetzen</button>';
  if(!bar){bar=document.createElement("div");bar.id="minibar";bar.className="minibar";document.getElementById("wrap").appendChild(bar);}
  bar.innerHTML=html;
 }else if(bar)bar.remove();
}
setInterval(function(){
 if(!S.active)return;
 const we=document.getElementById("welapsed");if(we)we.textContent=fmtClock(elapsedSec());
 const mt=document.getElementById("minitime");if(mt)mt.textContent=fmtClock(elapsedSec());
},1000);
render();
</script>
</body>
</html>
